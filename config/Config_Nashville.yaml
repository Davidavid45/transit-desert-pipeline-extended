# Transit Desert Analysis Configuration
# City: Nashville, TN (Davidson County)
# Modify these parameters to analyze a different city

# -----------------------------------------------------------------------------
# 1. Study Area
# -----------------------------------------------------------------------------
study_area:
  name: "Davidson County"
  state_fips: "47"        # Tennessee
  county_fips: "037"      # Davidson County (Nashville-Davidson metro)
  full_fips: "47037"
  crs_projected: "EPSG:2274"   # Tennessee State Plane (feet)
  crs_geographic: "EPSG:4326"

# City information for visualization
city:
  name: "Nashville"
  state: "Tennessee"

# Neighborhood labeling settings for maps
neighborhoods:
  enable: false
  source: 'osm'
  osm:
    feature_type: 'suburb'
    min_population: 1000


# -----------------------------------------------------------------------------
# 2. GTFS Feeds
# -----------------------------------------------------------------------------
gtfs:
  # WeGo Public Transit (Nashville MTA) — single consolidated feed
  url:
    - "https://www.wegotransit.com/GoogleExport/Google_Transit.zip"
  transitland_feed_id: "f-dn6-regionaltransportationauthorityofmiddletennessee~nashville"
  # Service date for analysis (typical weekday — UPDATE after downloading feed)
  # Check the feed's calendar.txt for valid dates
  analysis_date: "20260310"
  merge_feeds: false
  preferred_feed: "bus"


spatial:
  unit: "tract"
  crs_projected: "EPSG:2274"     # Tennessee State Plane
  crs_geographic: "EPSG:4326"
  buffer_bus: 400
  buffer_rail: 800
  decay_beta: 0.002

# -----------------------------------------------------------------------------
# 3. Census / ACS Data
# -----------------------------------------------------------------------------
census:
  acs_year: 2022
  acs_tables:
    vehicle_access: "B08201"
    poverty: "B17001"
    race_ethnicity: "B03002"
    age_sex: "B01001"

  youth_variables:
    male_10_14: "B01001_005E"
    male_15_17: "B01001_006E"
    female_10_14: "B01001_029E"
    female_15_17: "B01001_030E"
  youth_age_range: "10-17"


# -----------------------------------------------------------------------------
# 4. CPTA — Transit Service Metrics (Category 1)
# -----------------------------------------------------------------------------
transit_service:
  connectivity:
    decay_beta: 0.002
    bus_buffer_m: 400
    rail_buffer_m: 800

  route_coverage:
    bus_buffer_m: 400
    rail_buffer_m: 800
    rail_route_types: [0, 1, 2]
    bus_route_types: [3, 5, 7]

  # Frequency composite: collapse 4 time periods into 1 weighted metric
  # to avoid over-representing frequency in the transit service category.
  # Weights reflect peak-period primacy (Dr. Sevgi Erdogan, pers. comm.)
  # Aligned with Maryland statewide model 4-period breakdown.
  frequency_composite:
    enabled: true
    weights:
      freq_am_peak: 0.30
      freq_pm_peak: 0.30
      freq_midday: 0.20
      freq_evening: 0.20
 
  frequency_periods:
    am_peak:
      start: "06:30:00"
      end: "09:30:00"
      label: "AM Peak"
    midday:
      start: "09:30:00"
      end: "15:30:00"
      label: "Midday"
    pm_peak:
      start: "15:30:00"
      end: "18:30:00"
      label: "PM Peak"
    evening:
      start: "18:30:00"
      end: "06:30:00"
      label: "Evening"


# -----------------------------------------------------------------------------
# 5. CPTA — Accessibility Metrics (Category 2)
# -----------------------------------------------------------------------------
accessibility:
  walking_access:
    bus_buffer_m: 400
    rail_buffer_m: 800
    micromobility:
      enabled: false
      bus_buffer_m: 600
      rail_buffer_m: 1500

  job_accessibility:
    decay_beta: 0.08
    max_travel_time_minutes: 90
    departure_time: "08:00:00"
    travel_mode: "TRANSIT"
    employment_data: "LODES"

  poi_accessibility:
    departure_time: "10:00:00"
    travel_mode: "TRANSIT"
    max_travel_time_minutes: 60

    categories:
      healthcare:
        osm_tags:
          amenity: ["hospital", "clinic", "doctors", "pharmacy", "dentist"]
        decay_beta: 0.12
        weight: 0.20
        label: "Healthcare"

      grocery:
        osm_tags:
          shop: ["supermarket", "grocery", "convenience"]
          amenity: ["pharmacy"]
        decay_beta: 0.12
        weight: 0.20
        label: "Grocery & pharmacy"

      education:
        osm_tags:
          amenity: ["school", "college", "university", "library"]
        decay_beta: 0.05
        weight: 0.15
        label: "Education"

      parks:
        osm_tags:
          leisure: ["park", "playground", "sports_centre", "fitness_centre"]
        decay_beta: 0.08
        weight: 0.10
        label: "Parks & recreation"

      food_drink:
        osm_tags:
          amenity: ["restaurant", "cafe", "fast_food", "bar"]
        decay_beta: 0.08
        weight: 0.10
        label: "Food & drink"

      shopping:
        osm_tags:
          shop: ["mall", "department_store", "clothes", "electronics"]
        decay_beta: 0.08
        weight: 0.10
        label: "Shopping"

      entertainment:
        osm_tags:
          amenity: ["cinema", "theatre", "nightclub", "community_centre"]
          leisure: ["stadium"]
        decay_beta: 0.08
        weight: 0.05
        label: "Entertainment"

      personal_services:
        osm_tags:
          shop: ["hairdresser", "beauty", "laundry", "dry_cleaning"]
          amenity: ["bank", "post_office", "social_facility"]
        decay_beta: 0.08
        weight: 0.10
        label: "Personal services"


# -----------------------------------------------------------------------------
# 6. CPTA — Built Environment Metrics (Category 3)
# -----------------------------------------------------------------------------
built_environment:
  intersection_density:
    min_degree: 3
    network_type: "walk"
 
  land_use_mix:
    source: "sld"              # "sld" (EPA Smart Location Database) or "osm" (Shannon entropy)
    min_features: 15           # OSM fallback: minimum tagged features for reliable entropy
    test_thresholds: [10, 15, 20]
    osm_tags:
      - "building"
      - "landuse"
      - "amenity"
      - "shop"
      - "leisure"
      - "office"
      - "tourism"
 
  sidewalk_index:
    osm_tags:
      highway: ["footway", "pedestrian", "path", "steps"]
      footway: ["sidewalk", "crossing"]
      sidewalk: ["yes", "both", "left", "right"]
    # Normalize total sidewalk/footway length (meters) by tract area (sq km)
    normalize_by: "tract_area_km2"

# -----------------------------------------------------------------------------
# 7. CPTA Score Aggregation
# -----------------------------------------------------------------------------
cpta:
  aggregation_method: "category_weighted"
 
  category_weights:
    transit_service: 0.50
    accessibility: 0.25
    built_environment: 0.25
 
  # Within-category weighting: correlation-penalty (Sevgi Erdogan feedback)
  # Metrics highly correlated with others in their category get downweighted:
  #   w_m = 1 / Σ_k |r_mk|, then normalized to sum to 1 within category.
  # This prevents redundant metrics (e.g. correlated frequency periods)
  # from inflating a category's influence.
  within_category_weighting: "correlation_penalty"   # or "equal"
  
  category_members:
    transit_service:
      - "stop_connectivity"
      - "route_coverage"
      - "freq_composite"
      - "span_of_service"
      - "weekend_ratio"
    accessibility:
      - "walking_access"
      - "jobs_accessibility"
      - "poi_accessibility"
    built_environment:
      - "population_density"
      - "intersection_density"
      - "land_use_mix"
      - "sidewalk_index"

# -----------------------------------------------------------------------------
# 8. TVI — Transit Vulnerability Index
# -----------------------------------------------------------------------------
tvi:
  components:
    zero_vehicle:
      weight: 0.30
      label: "Zero-vehicle households"
      acs_table: "B08201"
    poverty:
      weight: 0.25
      label: "Below poverty line"
      acs_table: "B17001"
    minority:
      weight: 0.20
      label: "Minority population"
      acs_table: "B03002"
    elderly:
      weight: 0.15
      label: "Elderly (65+)"
      acs_table: "B01001"
    youth:
      weight: 0.10
      label: "Youth (10-17)"
      acs_table: "B01001"
      age_range: "10-17"
 
  # ── TVI-latent: Forced car ownership adjustment ──
  # Addresses the circularity where within-city zero-vehicle rates undercount
  # transit need in car-dependent areas (Allen & Farber 2021; Mattioli 2017).
  # When enabled, a second TVI variant (TVI_latent) is computed alongside
  # the observed TVI using the weights below.
  forced_car_ownership:
    enabled: true
    acs_table: "B08122"        # Means of Transportation to Work by Poverty Status
    variable: "pct_low_income_car_commute"  # computed in 01_download_data.py
    poverty_threshold: 150     # include workers below 150% poverty line
    label: "Low-income car commuters (forced car ownership proxy)"
    # Weight reallocation: split observed zero_vehicle weight in half
    # so TVI-latent captures both observed carlessness AND hidden car dependence
    latent_weights:
      zero_vehicle: 0.15       # halved from 0.30
      forced_car: 0.15         # new component takes the other half
      poverty: 0.25            
      minority: 0.20           
      elderly: 0.15            
      youth: 0.10              
 
  sensitivity_scenarios:
    base:
      label: "Base weights"
      weights:
        zero_vehicle: 0.30
        poverty: 0.25
        minority: 0.20
        elderly: 0.15
        youth: 0.10
 
    equal:
      label: "Equal weights"
      weights:
        zero_vehicle: 0.20
        poverty: 0.20
        minority: 0.20
        elderly: 0.20
        youth: 0.20
 
    vehicle_dominant:
      label: "Vehicle-access dominant"
      weights:
        zero_vehicle: 0.45
        poverty: 0.20
        minority: 0.15
        elderly: 0.10
        youth: 0.10

# -----------------------------------------------------------------------------
# 9. Desert Identification — LISA and Gap Analysis
# -----------------------------------------------------------------------------
identification:
  spatial_weights: "queen"
  permutations: 999
  significance_level: 0.05
  equity_test: "mann_whitney_u"
 
  # --- Absolute threshold layer (cross-city comparable) ---
  # Tracts failing >= fail_threshold criteria = "absolute transit desert"
  # These are applied UNIFORMLY across all cities — no within-city normalization.
  # Literature basis: Karner, Pereira & Farber (2024); Grengs et al. FTA Report 0066
  absolute_thresholds:
    enabled: true
    fail_threshold: 3          # number of criteria a tract must fail
 
    criteria:
      route_coverage:
        metric: "route_coverage"        # from CPTA components
        operator: ">="
        value: 1
        label: "≥1 route within buffer"
 
      peak_headway:
        metric: "freq_am_peak"          # departures/hr; 2 dep/hr = 30-min headway
        operator: ">="
        value: 2.0
        label: "Peak headways ≤30 min"
 
      walking_access:
        metric: "walking_access"        # proportion 0-1
        operator: ">="
        value: 0.25
        label: "≥25% tract within walk buffer"
 
      span_of_service:
        metric: "span_of_service"       # hours
        operator: ">="
        value: 12
        label: "Service span ≥12 hrs"
 
      job_accessibility:
        metric: "jobs_accessibility"    # raw job count (pre-normalization)
        operator: ">="
        value: 5000
        label: "≥5,000 jobs within 45 min"


# -----------------------------------------------------------------------------
# 10. Output Paths
# -----------------------------------------------------------------------------
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  output_maps: "outputs/maps"
  output_figures: "outputs/figures"
  output_tables: "outputs/tables"
  logs: "logs"

outputs:
  shapefile: true
  geojson: true
  csv: true
  map_dpi: 300
  map_figsize: [12, 10]

